# specs/product/SCOPE_LATEST.yaml — generated by scope-work from planning-context.yaml
core_value: "Aplikasi full SPA berbasis Next.js Static Export dan backend Hono D1/R2 tanpa beban render SSR di Cloudflare Worker."

summary: |
  Inisiatif ini memigrasikan aplikasi dari model hibrida Next.js SSR/OpenNext ke arsitektur decoupled murni.
  Frontend diubah menjadi SPA statis 100% menggunakan Next.js output export yang di-deploy ke Cloudflare Pages.
  Backend komputasi dipusatkan ke Hono di Cloudflare Workers dengan database Cloudflare D1 dan media storage Cloudflare R2 direct-upload.
  Seluruh 59 halaman client-side dipertahankan utuh, sedangkan 7 halaman server dikonversi menjadi client fetch.

in_scope:
  - id: item-frontend-export
    title: "Konfigurasi Static Export & Konversi 7 Server Components"
    description: "Mengonfigurasi next.config.mjs ke output: 'export' dan mengubah 7 halaman server menjadi client-side fetch."
  - id: item-drizzle-d1
    title: "Migrasi Skema & Driver Drizzle ke Cloudflare D1"
    description: "Mengadaptasi skema Drizzle dari Turso/libsql ke Cloudflare D1 (SQLite native) dan menyiapkan migrasi tabel."
  - id: item-hono-api-porting
    title: "Porting Endpoint API ke Hono Worker"
    description: "Memindahkan seluruh route handler di app/api/* ke Hono router di worker/index.ts dengan auth JWT/cookie."
  - id: item-r2-direct-upload
    title: "Implementasi Direct Upload Cloudflare R2"
    description: "Endpoint presigned URL di Hono dan integrasi upload langsung dari browser untuk file/gambar."
  - id: item-routing-deployment
    title: "Konfigurasi Routing Cloudflare & CI/CD Deployment"
    description: "Pengaturan single domain (_routes.json / CF Routes) menghubungkan Pages (/*) dan Worker (/api/*)."

out_of_scope:
  - item: "Server Actions dan React Server Components"
    rationale: "Dieliminasi karena target adalah 100% static client-side render."
  - item: "Layanan Turso (libsql) dan Cloudinary"
    rationale: "Digantikan penuh oleh Cloudflare D1 dan Cloudflare R2 untuk ekosistem native CF."
  - item: "Rewrite router ke Vite / React Router"
    rationale: "Menghindari risiko regresi fitur dan perombakan 59 halaman client eksisting."

constraints:
  - "Frontend wajib 100% statis tanpa dependensi Node.js server saat runtime."
  - "Backend dibatasi oleh Cloudflare Worker limits (V8 runtime, no Node native except nodejs_compat)."
  - "Semua interaksi DB lokal dan cloud wajib kompatibel dengan D1 SQLite dialect."
  - "Single domain URL structure agar session cookie dan fetch /api/* bebas CORS."

success_criteria:
  - "`npm run build` sukses menghasilkan direktori `out/` statis tanpa error export."
  - "Semua 66 halaman dapat diakses melalui browser dengan fallback SPA tanpa 404 pada URL dinamis."
  - "Seluruh fungsionalitas API utama (Auth, Absensi, Kegiatan, Generus, Laporan) lulus uji di Hono + D1."
  - "Upload gambar/dokumen berhasil langsung ke R2 tanpa melewati proxy komputasi worker."
  - "Beban CPU/compute worker untuk rendering turun menjadi 0%."

references:
  - "specs/planning-context.yaml"
